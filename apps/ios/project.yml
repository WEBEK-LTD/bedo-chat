# Bedo Chat for iPhone (D-53). GitHub Actions turns this into the Xcode project with XcodeGen and builds it
# (.github/workflows/apps.yml); no Mac is needed. The app shows https://bedochat.com.
name: BedoChat
options:
  bundleIdPrefix: com.bedochat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BedoChat:
    type: application
    platform: iOS
    sources:
      - path: BedoChat
        excludes:
          - "*.entitlements"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedochat.app
        PRODUCT_NAME: BedoChat
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BedoChat/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: BedoChat/Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: BedoChat/Release.entitlements
    info:
      path: BedoChat/Info.plist
      properties:
        CFBundleDisplayName: Bedo Chat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Bedo Chat uses the camera when you take a photo or record a video message.
        NSMicrophoneUsageDescription: Bedo Chat uses the microphone when you record a voice or video message.
        NSPhotoLibraryUsageDescription: Bedo Chat opens your photos when you choose one to send.
