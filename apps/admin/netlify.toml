# NOT the production Netlify configuration (D-26). Bedo Chat has ONE Netlify site, configured by
# apps/web/netlify.toml (package directory apps/web); that site's build includes the Admin Dashboard under /admin.
# Netlify reads this file only for a site whose package directory is apps/admin, or for a CLI command run with
# `--filter @bedo/admin`. Building that way would publish the Admin Dashboard alone at the site root.
#
# Production guard (Phase 2.3.1): the build command below always fails with an explicit message, so a site
# configured to build from apps/admin stops with an error instead of deploying the Admin Dashboard alone (Netlify
# then keeps the last good deploy). The admin app is still built for production, as part of the apps/web build.
# Kept as the record of the admin app's original site settings (publish path checked by scripts/checks.test.mjs).
#
# Netlify site: Bedo Chat admin app (D-15). Exact site settings are in docs/DEPLOYMENT.md.
#
# Monorepo rules (Netlify documentation, "Monorepos" and "File-based configuration"):
# - This file is found because the site's Package directory is apps/admin. Netlify only lets the
#   package directory be set in its UI; it has no netlify.toml property.
# - The Base directory stays empty (repository root). Dependencies install and the build command runs
#   there, so pnpm sees the whole workspace.
# - Every path below is relative to the base directory (repository root), NOT to this folder. That is
#   why publish names the app folder explicitly; a bare ".next" would point at <repo>/.next.
# The Next.js runtime (@netlify/plugin-nextjs, OpenNext adapter) is applied automatically; do not pin it.

[build]
  # Phase 2.3.1 production guard: never build or deploy the Admin Dashboard as a site of its own.
  command = "echo 'ERROR: Bedo Chat production uses ONE Netlify site (D-26). The production Package directory must be apps/web, not apps/admin. Building from apps/admin would deploy the Admin Dashboard alone at the site root, so this build stops here. Set the Package directory of the Netlify site to apps/web and deploy again; that build includes the Admin Dashboard under /admin.' >&2; exit 1"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
  TURBO_TELEMETRY_DISABLED = "1"
