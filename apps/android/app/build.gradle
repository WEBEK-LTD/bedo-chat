plugins {
    id 'com.android.application'
}

// D-58: notifications come through Firebase. The workflow writes app/google-services.json from the repository secret
// GOOGLE_SERVICES_JSON (Firebase → Project settings → Your apps → google-services.json); without it the app builds and
// works, without notifications.
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) {
    apply plugin: 'com.google.gms.google-services'
}

// The site the app opens, and the version numbers GitHub Actions gives each build.
def siteHost = 'bedochat.com'
// Google Play needs a higher version code for every upload, whichever workflow or computer built it: the minutes since
// 2026-01-01 (UTC) at build time always grow.
def buildNumber = ((System.currentTimeMillis() - 1767225600000L) / 60000L) as Integer
def keystorePath = System.getenv('BEDO_ANDROID_KEYSTORE')

android {
    namespace 'com.bedochat.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bedochat.app'
        minSdk 24
        targetSdk 36
        versionCode buildNumber
        versionName "1.1 (" + new java.text.SimpleDateFormat('yyyy.MM.dd', Locale.ROOT).format(new Date()) + ")"
        buildConfigField 'String', 'SITE_HOST', "\"${siteHost}\""
        buildConfigField 'boolean', 'FIREBASE', "${firebaseConfigured}"
        manifestPlaceholders = [hostName: siteHost]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('BEDO_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BEDO_ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('BEDO_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation platform('com.google.firebase:firebase-bom:33.15.0')
    implementation 'com.google.firebase:firebase-messaging'
}
