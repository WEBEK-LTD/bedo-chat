plugins {
    id 'com.android.application'
}

// The site the app opens, and the version numbers GitHub Actions gives each build.
def siteUrl = 'https://bedochat.com'
// Google Play needs a higher version code for every upload, whichever workflow or computer built it: the minutes since
// 2026-01-01 (UTC) at build time always grow.
def buildNumber = ((System.currentTimeMillis() - 1767225600000L) / 60000L) as Integer
def keystorePath = System.getenv('BEDO_ANDROID_KEYSTORE')

android {
    namespace 'com.bedochat.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bedochat.app'
        minSdk 23
        targetSdk 36
        versionCode buildNumber
        versionName "1.0 (" + new java.text.SimpleDateFormat('yyyy.MM.dd', Locale.ROOT).format(new Date()) + ")"
        manifestPlaceholders = [
            hostName       : 'bedochat.com',
            launchUrl      : "${siteUrl}/",
            assetStatements: '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "web", "site": "' + siteUrl + '"}}]',
        ]
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('BEDO_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BEDO_ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('BEDO_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
