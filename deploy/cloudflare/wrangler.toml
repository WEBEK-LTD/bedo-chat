# Cloudflare Worker that serves https://bedochat.com from the Bedo Chat origins (D-25).
# D-37: deployed by Cloudflare itself from GitHub (Workers & Pages -> Import a repository, root directory
# deploy/cloudflare); see docs/DEPLOYMENT.md, section 0. Cloudflare runs `npx wrangler deploy` here with the Wrangler
# version pinned in package.json. No command line is needed.
# The Worker's name in the Cloudflare dashboard must stay "bedochat-router" (Cloudflare refuses a build otherwise).
name = "bedochat-router"
main = "worker.js"
compatibility_date = "2026-09-01"

# bedochat.com is attached to the Worker as a Custom Domain on deploy: Cloudflare creates its DNS record and
# certificate. Any other A, AAAA or CNAME record for bedochat.com must be deleted first.
routes = [
  { pattern = "bedochat.com", custom_domain = true },
]

[vars]
# The one Netlify site (D-26) serves the student web app and, under /admin, the Admin Dashboard.
WEB_ORIGIN = "https://bedochat.netlify.app"
ADMIN_ORIGIN = "https://bedochat.netlify.app"
# The API's own address at Render (render.yaml service "bedochat-api"); not a public bedochat.com address.
API_ORIGIN = "https://bedochat-api.onrender.com"

# EDGE_SECRET is a Worker secret, never written here: Worker -> Settings -> Variables and Secrets -> Add, type
# Secret, with the value of EDGE_SECRET from Render (bedochat-api -> Environment).
