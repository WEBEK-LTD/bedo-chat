# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Bedo Chat persistent backend on Render (D-15, D-37): the API (with its WebSocket gateway), the worker and Redis
# (Render Key Value, used by BullMQ and the realtime fan-out). Render creates all three from this file:
# Dashboard -> New -> Blueprint -> this repository -> Apply. See docs/DEPLOYMENT.md, section 0.
#
# The only value Render asks for is PGPASSWORD: the password of the database login bedo_api (the same value in both
# boxes, one for the API and one for the worker). Everything else is fixed here or generated by Render:
# - The database is the Bedo Chat Supabase project in Sydney, reached through its session pooler (port 5432) as
#   bedo_api, with full certificate checking against Supabase's CA certificate, which the images carry at
#   /app/certs/supabase-ca.crt (deploy/supabase/prod-ca-2021.crt). DATABASE_URL holds no password: node-postgres
#   takes it from PGPASSWORD.
# - Secrets (ACCESS_TOKEN_SECRET, OTP_HMAC_SECRET, ADMIN_TOTP_KEY, SETTINGS_ENCRYPTION_KEY, EDGE_SECRET) are
#   generated once by Render (random 256-bit, base64) and never change on later syncs. SETTINGS_ENCRYPTION_KEY is
#   in the shared group, so the API and the worker always hold the same key.
# - Not set on purpose: WAABEK_API_KEY (D-32: set from the Admin Dashboard; the worker refuses it), SUPABASE_URL /
#   SUPABASE_SERVICE_ROLE_KEY (profile pictures off) and VAPID_* (push notifications off) for this first deployment.
#
# Region: Singapore, Render's closest region to the Supabase project in Sydney (Render has no Australian region).
# Automatic deploys are off: a push to GitHub deploys nothing until you click Manual Deploy on the service.

envVarGroups:
  - name: bedochat-shared
    envVars:
      - key: DATABASE_URL
        value: postgresql://bedo_api.cspnnzoyuyxjiyhwzgqj@aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=/app/certs/supabase-ca.crt
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: '15000'
      - key: QUEUE_PREFIX
        value: bedo
      - key: LOG_LEVEL
        value: info
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true

services:
  - type: keyvalue
    name: bedochat-redis
    region: singapore
    plan: 256mb
    # BullMQ needs noeviction: with any other policy Redis may silently drop queued jobs.
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    # Empty: no connections from the internet; only the API and worker connect, over Render's private network.
    ipAllowList: []

  - type: web
    name: bedochat-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 30
    envVars:
      - fromGroup: bedochat-shared
      - key: PGPASSWORD
        sync: false
      # The port the API listens on (API_PORT in the image); Render sends traffic to it.
      - key: PORT
        value: '4000'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bedochat-redis
          property: connectionString
      # D-25: one public origin; browsers reach the API at https://bedochat.com/api through the Cloudflare Worker.
      - key: CORS_ALLOWED_ORIGINS
        value: https://bedochat.com
      - key: ADMIN_ORIGINS
        value: https://bedochat.com
      - key: WEB_ORIGINS
        value: https://bedochat.com
      - key: API_PUBLIC_PATH
        value: /api
      # The Cloudflare Worker and Render's own proxy (confirmed after deployment, docs/DEPLOYMENT.md section 0).
      - key: API_TRUST_PROXY_HOPS
        value: '2'
      # The same value is added to the Cloudflare Worker as its EDGE_SECRET secret.
      - key: EDGE_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: ADMIN_TOTP_KEY
        generateValue: true

  - type: worker
    name: bedochat-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    # Jobs in progress finish before the worker stops on a deploy.
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: bedochat-shared
      - key: PGPASSWORD
        sync: false
      - key: DATABASE_POOL_MAX
        value: '3'
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bedochat-redis
          property: connectionString
