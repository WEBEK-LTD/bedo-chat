name: Copy the Android build (check only)
on:
  push:
    branches: [app-build-check]
permissions:
  contents: write
  actions: read
jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-app
          run-id: 38431535074
          github-token: ${{ github.token }}
          path: out
      - name: Save to the app-build-release branch
        run: |
          ls -la out
          cd out
          git init -q -b app-build-release
          git config user.name "build-check"; git config user.email "noreply@github.com"
          git add -A && git commit -qm "Android build 20"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-build-release
