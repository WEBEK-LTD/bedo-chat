name: Android web view app check (check only)
on:
  push:
    branches: [app-build-check]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BEDO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Build (debug, and release signed with the upload key)
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export BEDO_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
          mkdir -p shots
          gradle --no-daemon -p apps/android assembleDebug assembleRelease bundleRelease > shots/build.log 2>&1 || { grep -E "error:|e: |What went wrong|> |Could not|FAILED" shots/build.log | head -30 | while IFS= read -r line; do echo "::error title=build::$line"; done; rm -f "$RUNNER_TEMP/upload.jks"; exit 1; }
          rm -f "$RUNNER_TEMP/upload.jks"
          cp apps/android/app/build/outputs/apk/release/app-release.apk shots/bedo-chat-release.apk
          cp apps/android/app/build/outputs/bundle/release/app-release.aab shots/bedo-chat-release.aab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Devtools helper
        run: |
          cat > "$RUNNER_TEMP/eval.mjs" <<'JS'
          const [port, expression] = process.argv.slice(2);
          const pages = await (await fetch(`http://127.0.0.1:${port}/json`)).json();
          const page = pages.find((p) => p.type === 'page');
          if (!page) { console.log('NO PAGE ' + JSON.stringify(pages)); process.exit(0); }
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          await new Promise((r) => ws.addEventListener('open', r));
          ws.send(JSON.stringify({ id: 1, method: 'Runtime.evaluate', params: { expression, awaitPromise: true, returnByValue: true } }));
          const reply = await new Promise((r) => ws.addEventListener('message', (e) => r(JSON.parse(e.data))));
          console.log(JSON.stringify(reply.result?.result?.value ?? reply));
          ws.close();
          JS
      - name: Emulator script
        run: |
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          set -x
          E="node $RUNNER_TEMP/eval.mjs 9222"
          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || return 1
            adb shell cat /sdcard/ui.xml > /tmp/ui.xml
            B=$(grep -o "text=\"$1\"[^>]*bounds=\"\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]\"" /tmp/ui.xml | grep -o '\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]' | head -1)
            [ -n "$B" ] || return 1
            set -- $(echo "$B" | sed -E 's/\[([0-9]+),([0-9]+)\]\[([0-9]+),([0-9]+)\]/\1 \2 \3 \4/')
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
          }
          calm() { for i in 1 2 3; do tap_text "Wait" && sleep 2 || break; done; }
          sleep 120
          adb install -r apps/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n com.bedochat.app/.MainActivity
          sleep 2
          adb exec-out screencap -p > shots/1-start.png
          sleep 30
          adb shell pidof com.bedochat.app || { echo "restarted" > shots/restarted.txt; adb shell am start -n com.bedochat.app/.MainActivity; sleep 30; }
          adb exec-out screencap -p > shots/2-open-light.png
          adb shell dumpsys activity activities | grep -E "topResumedActivity" > shots/activity.txt || true
          PID=$(adb shell pidof com.bedochat.app | tr -d '\r')
          adb forward tcp:9222 localabstract:webview_devtools_remote_$PID
          $E "JSON.stringify({ href: location.href, title: document.title, bridge: typeof window.bedoAndroid, dark: matchMedia('(prefers-color-scheme: dark)').matches, ua: navigator.userAgent })" > shots/page.txt 2>&1 || true
          $E "new Promise((resolve) => { const b = window.bedoAndroid; if (!b) return resolve('no bridge'); b.addEventListener('message', (e) => resolve(String(e.data))); b.postMessage(JSON.stringify({ id: 7, type: 'push-status' })); setTimeout(() => resolve('timeout'), 10000); })" > shots/bridge-status.txt 2>&1 || true
          $E "new Promise((resolve) => { const b = window.bedoAndroid; b.addEventListener('message', (e) => resolve(String(e.data))); b.postMessage(JSON.stringify({ id: 8, type: 'push-enable' })); setTimeout(() => resolve('timeout'), 60000); })" > shots/bridge-enable.txt 2>&1 &
          sleep 6
          calm
          adb exec-out screencap -p > shots/3-permission.png
          tap_text "Allow" || true
          sleep 5
          wait || true
          $E "new Promise((resolve) => { const b = window.bedoAndroid; b.addEventListener('message', (e) => resolve(String(e.data))); b.postMessage(JSON.stringify({ id: 9, type: 'push-status' })); setTimeout(() => resolve('timeout'), 10000); })" > shots/bridge-after.txt 2>&1 || true
          $E "new Promise((resolve) => { const b = window.bedoAndroid; b.addEventListener('message', (e) => resolve(String(e.data))); b.postMessage(JSON.stringify({ id: 10, type: 'nonsense' })); setTimeout(() => resolve('timeout'), 10000); })" > shots/bridge-unknown.txt 2>&1 || true
          # Links: privacy page stays in the app.
          calm
          $E "document.querySelector('a[href=\"/privacy\"]').click(); 'ok'" > shots/click.txt 2>&1 || true
          sleep 8
          adb exec-out screencap -p > shots/4-privacy.png
          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > shots/focus.txt || true
          adb shell input keyevent KEYCODE_BACK
          sleep 6
          adb exec-out screencap -p > shots/5-back.png
          adb shell dumpsys activity activities | grep -E "topResumedActivity" > shots/activity-after-back.txt || true
          adb logcat -d -s BedoChat > shots/back-log.txt || true
          adb logcat -d | grep -iE "bedochat|chromium|AndroidRuntime|FATAL" | tail -150 > shots/log-debug.txt || true
          adb uninstall com.bedochat.app || true
          adb install -r shots/bedo-chat-release.apk
          adb shell cmd uimode night yes
          adb shell am start -n com.bedochat.app/.MainActivity
          sleep 40
          adb exec-out screencap -p > shots/6-release-dark.png
          adb shell cmd uimode night no
          adb shell am force-stop com.bedochat.app
          adb shell am start -n com.bedochat.app/.MainActivity
          sleep 30
          adb exec-out screencap -p > shots/7-release-light.png
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.bedochat.app
          adb shell am start -n com.bedochat.app/.MainActivity
          sleep 15
          adb exec-out screencap -p > shots/8-offline.png
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb logcat -d | grep -iE "bedochat|AndroidRuntime|FATAL" | tail -100 > shots/log-release.txt || true
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          cores: 4
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash $RUNNER_TEMP/run.sh
      - name: Save
        if: always()
        run: |
          mkdir -p shots "$RUNNER_TEMP/s" && cp -r shots/. "$RUNNER_TEMP/s/" || true
          touch "$RUNNER_TEMP/s/.keep"
          cd "$RUNNER_TEMP/s"
          git init -q -b r && git config user.name "build-check" && git config user.email "noreply@github.com"
          git add -A && git commit -qm "Android web view check"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:refs/heads/app-build-shots
