name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bedo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bedo"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bedo
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      # Placeholder present during the build as well, so the bundle guard proves that a server-only
      # value available at build time still never reaches browser files.
      WAABEK_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile only, install scripts blocked by policy)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: OpenAPI document is committed and current
        run: git diff --exit-code -- apps/api/openapi/openapi.json

      - name: User web app exposes only /login and / (source and build output)
        run: pnpm check:routes

      - name: No server-only data in client bundles
        run: pnpm check:bundles

      - name: Apply migrations to an empty database
        run: pnpm db:migrate

      - name: Re-running migrations is a no-op
        run: pnpm db:migrate

      - name: Integration tests (real Postgres and Redis)
        run: pnpm test:integration

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.24.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan repository history
        run: gitleaks git --redact --verbose .

  dependency-scan:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.0.0
    steps:
      - uses: actions/checkout@v5
      - name: Install osv-scanner
        run: |
          curl -sSfL -o /usr/local/bin/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan the lockfile
        run: osv-scanner scan source --lockfile=pnpm-lock.yaml
