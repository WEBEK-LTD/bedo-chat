name: Check the site link (check only)
on:
  push:
    branches: [app-build-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: What the site serves and what Google's link check answers
        run: |
          mkdir -p out
          curl -sS -D out/headers.txt https://bedochat.com/.well-known/assetlinks.json -o out/assetlinks.json || true
          curl -sS -o /dev/null -w "%{http_code} %{redirect_url}\n" https://bedochat.com/ > out/root.txt || true
          for fp in AE:24:C2:17:29:C3:64:2F:E1:03:77:82:C2:05:8D:34:BF:B7:58:D9:8E:28:09:6A:1B:C1:E6:7B:5C:02:45:67 D4:F8:B6:7E:F8:D2:49:DE:DF:0F:9B:91:F0:3F:36:89:F5:13:C6:E1:AF:79:67:05:9E:0C:FB:6B:46:6E:31:F2; do
            echo "== $fp" >> out/check.txt
            curl -sS "https://digitalassetlinks.googleapis.com/v1/assetlinks:check?source.web.site=https://bedochat.com&relation=delegate_permission/common.handle_all_urls&target.android_app.package_name=com.bedochat.app&target.android_app.certificate.sha256_fingerprint=$fp" >> out/check.txt || true
            echo >> out/check.txt
          done
          curl -sS "https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=https://bedochat.com&relation=delegate_permission/common.handle_all_urls" > out/statements.json || true
          cat out/*
      - name: Save
        run: |
          cd out && git init -q -b app-build-shots && git config user.name "build-check" && git config user.email "noreply@github.com"
          git add -A && git commit -qm "link check" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-build-shots
