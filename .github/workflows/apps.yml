name: Apps

# D-53: builds the Android and iPhone apps, which open https://bedochat.com. Runs when the apps change, or by hand:
# GitHub -> Actions -> Apps -> Run workflow. The signing keys come from the repository's secrets
# (Settings -> Secrets and variables -> Actions); without them the jobs still build, unsigned, to check the apps.

on:
  push:
    branches: [main, app-build-check]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BEDO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v5

      # D-58: the app's Firebase settings (notifications), from the repository secret; without it the app builds and
      # works without notifications.
      - name: Firebase settings
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert any(c['client_info']['android_client_info']['package_name']=='com.bedochat.app' for c in d['client']), 'google-services.json is not for com.bedochat.app'" apps/android/app/google-services.json \
              || { echo "::error title=Android app::GOOGLE_SERVICES_JSON is not the google-services.json of the Android app com.bedochat.app"; exit 1; }
            echo "::notice title=Android app::Firebase settings found: notifications on"
          else
            echo "::warning title=Android app::No GOOGLE_SERVICES_JSON secret: this build has no notifications (docs/APPS.md, A4)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Signed build for Google Play (.aab) and phones (.apk)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export BEDO_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle --no-daemon -p apps/android bundleRelease assembleRelease
          mkdir -p out
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "out/bedo-chat-${GITHUB_RUN_NUMBER}.aab"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "out/bedo-chat-${GITHUB_RUN_NUMBER}.apk"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Test build (no signing key in the repository's secrets)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          gradle --no-daemon -p apps/android assembleDebug
          mkdir -p out
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "out/bedo-chat-test-${GITHUB_RUN_NUMBER}.apk"

      - name: Check the app
        run: |
          APK=$(ls out/*.apk | head -1)
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          SIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$ANALYZER" manifest print "$APK" > manifest.xml
          "$ANALYZER" dex packages --defined-only "$APK" > classes.txt
          # D-58: the app's own web view activity and its notification service are in the app; no browser helper.
          for class in com.bedochat.app.MainActivity com.bedochat.app.PushService com.bedochat.app.Push; do
            grep -qF "$class" classes.txt || { echo "::error title=Android app::$class is missing from the app"; exit 1; }
          done
          ! grep -q 'androidbrowserhelper' manifest.xml || { echo "::error title=Android app::the manifest still names the Trusted Web Activity helper"; exit 1; }
          grep -q 'android.permission.POST_NOTIFICATIONS' manifest.xml || { echo "::error title=Android app::notification permission missing"; exit 1; }
          # Chromebooks without a touch screen must not be filtered out on Google Play.
          tr '\n' ' ' < manifest.xml | grep -qE '<uses-feature[^>]*android.hardware.touchscreen[^>]*required="false"|<uses-feature[^>]*required="false"[^>]*android.hardware.touchscreen' || { echo "::error title=Android app::touch screen must be optional (Chromebooks)"; exit 1; }
          attr() { grep -o "android:$1=\"[^\"]*\"" manifest.xml | head -1 | sed 's/.*="//; s/"$//'; }
          echo "::notice title=Android app::$(basename "$APK"): version $(attr versionName) ($(attr versionCode)), target SDK $(attr targetSdkVersion), min SDK $(attr minSdkVersion)"
          # The signing certificate's SHA-256 (for the website's /.well-known/assetlinks.json).
          echo "::notice title=Android signing certificate::$("$SIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: //')"

      - uses: actions/upload-artifact@v5
        with:
          name: android-app
          path: out/
          retention-days: 30

  ios:
    name: iPhone app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      # Apple accepts uploads built with the iOS 26 SDK or later (Xcode 26+): use the newest Xcode on the runner.
      - name: Use Xcode 26 or later
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error title=iPhone app::no Xcode 26 or later on this runner: $(ls -d /Applications/Xcode_* | xargs -n1 basename | tr '\n' ' ')"; exit 1; }
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "::notice title=iPhone app::$(xcodebuild -version | tr '\n' ' ')"

      - name: Make the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and upload to TestFlight
        if: env.ASC_KEY != '' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.APPLE_TEAM_ID != ''
        working-directory: apps/ios
        env:
          BUNDLE_ID: com.bedochat.app
        run: |
          set -o pipefail
          # Apple's error lines also go to the run's annotations (the summary page), not only the log.
          report() { grep -E 'error:|Error Domain|failed|ERROR' "$RUNNER_TEMP/xcode.log" | sort -u | head -8 | while IFS= read -r line; do echo "::error title=iPhone app::$line"; done; exit 1; }
          SIGN="$RUNNER_TEMP/signing"
          # An Apple Distribution certificate and an App Store profile for this build, made through the API key
          # (apps/ios/ci/signing.py); the next build removes them.
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 ci/signing.py setup "$SIGN"
          P12_PASSWORD=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['p12Password'])" "$SIGN/signing.json")
          PROFILE_NAME=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['profileName'])" "$SIGN/signing.json")
          PROFILE_UUID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['profileUuid'])" "$SIGN/signing.json")
          echo "::add-mask::$P12_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGN/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          for dir in ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$dir" && cp "$SIGN/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$APPLE_TEAM_ID" "$PROFILE_NAME" <<'PY'
          import plistlib, sys
          path, team, profile = sys.argv[1:4]
          plistlib.dump({
              'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'manual', 'teamID': team,
              'signingCertificate': 'Apple Distribution', 'provisioningProfiles': {'com.bedochat.app': profile},
              'uploadSymbols': True, 'manageAppVersionAndBuildNumber': False,
          }, open(path, 'wb'))
          PY
          xcodebuild archive -project BedoChat.xcodeproj -scheme BedoChat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/BedoChat.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" 2>&1 | tee "$RUNNER_TEMP/xcode.log" || report
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BedoChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$RUNNER_TEMP/xcode.log" || report
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          # Check the signed app before it goes to Apple: App Store signature and the push entitlement.
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -d --entitlements - --xml "$APP" 2>/dev/null > "$RUNNER_TEMP/entitlements.xml" || true
          grep -q 'aps-environment' "$RUNNER_TEMP/entitlements.xml" || { echo "::error title=iPhone app::the signed app has no push entitlement"; exit 1; }
          echo "::notice title=iPhone app::$(codesign -dvv "$APP" 2>&1 | grep -m1 '^Authority='), push: $(grep -o 'production\|development' "$RUNNER_TEMP/entitlements.xml" | head -1)"
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/xcode.log" || report
          echo "::notice title=iPhone app::Build $GITHUB_RUN_NUMBER uploaded to App Store Connect (TestFlight shows it after Apple's processing)."
          rm -rf ~/.appstoreconnect/private_keys "$SIGN"
          security delete-keychain "$KEYCHAIN"

      - name: Test build (no App Store Connect key in the repository's secrets)
        if: env.ASC_KEY == '' || env.ASC_KEY_ID == '' || env.ASC_ISSUER_ID == '' || env.APPLE_TEAM_ID == ''
        working-directory: apps/ios
        run: |
          xcodebuild build -project BedoChat.xcodeproj -scheme BedoChat -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
