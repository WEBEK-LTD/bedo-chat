name: TWA check on newer Chrome (check only)
on:
  push:
    branches: [app-build-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          cores: 4
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          disable-animations: true
          script: |
            mkdir -p shots
            adb shell dumpsys package com.android.chrome | grep -m1 versionName > shots/chrome-${{ matrix.api }}.txt || true
            adb shell 'echo "_ --disable-fre --no-default-browser-check --no-first-run" > /data/local/tmp/chrome-command-line'
            adb shell am set-debug-app --persistent com.android.chrome || true
            sleep 60
            adb install -r app.apk
            adb logcat -c
            adb shell am start -n com.bedochat.app/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 75
            adb exec-out screencap -p > shots/open-${{ matrix.api }}.png
            adb shell dumpsys activity activities | grep -E "topResumedActivity" > shots/activity-${{ matrix.api }}.txt || true
            adb logcat -d | grep -iE "Verif|DigitalAsset|AssetLink|OriginVerifier|TrustedWeb|TwaLauncher|cr_Twa|cr_Custom|PostMessage|Relationship" | grep -v ImeTracker | tail -200 > shots/log-${{ matrix.api }}.txt || true
      - name: Save
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp shots/* "$RUNNER_TEMP/s/" || true
          cd "$RUNNER_TEMP/s"
          git init -q -b r && git config user.name "build-check" && git config user.email "noreply@github.com"
          git add -A && git commit -qm "TWA check ${{ matrix.api }}"
          for i in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:refs/heads/app-build-shots-${{ matrix.api }} && break; sleep 5; done
