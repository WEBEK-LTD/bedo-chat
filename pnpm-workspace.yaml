packages:
  - apps/*
  - packages/*

# Supply-chain policy (carried from the approved baseline):
# - packages must have been published for at least 14 days before they can be installed
# - dependency install scripts are blocked; any package that wants to run one fails the
#   install until it is explicitly reviewed and listed below
minimumReleaseAge: 20160
# Security exceptions to the 14-day rule. Each entry needs a reason and is removed once the
# patched version is older than 14 days (recorded in docs/DECISIONS.md). None are needed at present: the
# 2026-10 exceptions (next, @next/*, sharp, @img/*, source-map-js) were removed on 2026-11-14 because the
# patched versions are now older than 14 days.
strictDepBuilds: true
# Every package with an install script must be listed in allowBuilds after review:
# true = allowed to run, false = reviewed and deliberately NOT run.
#
# - esbuild (via orval > @orval/core, Phase 2 API-client generator, development only): its install step only
#   replaces the JavaScript launcher with the platform binary for speed; the binary itself ships as an
#   optional @esbuild/<platform> package, so esbuild works without the script.
allowBuilds:
  esbuild: false

# Force patched transitive versions (security advisories found by `pnpm audit`).
# - fastify >=5.12.6: DoS via unhandled exception on HTTP/2 trailer responses (fixed in 5.12.5) and a header
#   validation bypass (fixed in 5.12.6); @nestjs/platform-fastify pins an older 5.12.x.
# - fast-uri >=3.1.9 / >=4.2.3: URI scheme spoofing and host confusion advisories (2026-10), reached through
#   fastify > @fastify/ajv-compiler (> ajv).
# - undici >=7.30.1: several advisories in 7.x before 7.30.1 (reached only through the development-time
#   API-client generator: orval > @scalar/json-magic).
# - source-map-js >=1.2.2: GHSA-68fv-2mgg-jv7q (high) in 1.0.0-1.2.1 (development only: vite > postcss).
# - sharp >=0.35.5: GHSA-wq5f-xc86-pv6w (high) in < 0.35.5 (next's optional image optimisation).
overrides:
  fastify: ^5.12.6
  fast-uri@3: ^3.1.9
  fast-uri@4: ^4.2.3
  undici: ^7.30.1
  source-map-js: ^1.2.2
  sharp: ^0.35.5
